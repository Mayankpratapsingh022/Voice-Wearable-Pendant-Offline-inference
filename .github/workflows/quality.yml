name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze
      - name: Test Flutter
        working-directory: app
        run: flutter test
      - name: Test Voice Link packet codec
        run: >-
          clang -std=c11 -Wall -Wextra -Werror -Ifirmware/main
          firmware/main/voice_link.c firmware/tests/voice_link_test.c
          -o /tmp/voice_link_test && /tmp/voice_link_test
